<!doctype html>
<html lang="fr" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/png" href="/assets/magic-deck-icon.png">
  <title>Magic Deck</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/motion@13.2.0/dist/motion.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=DM+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    window.tailwind = window.tailwind || {};
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { ink: '#0b0d10', panel: '#15191e', gold: '#d9ae61', rust: '#b9543d', chalk: '#f2eee5' } } } };
  </script>
  <link rel="stylesheet" href="/assets/app.css">
  <link rel="stylesheet" href="/assets/simulation.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mana-font@1.18.0/css/mana.min.css">
</head>
<body class="min-h-screen text-slate-200 antialiased">
  <div class="app-shell min-h-screen lg:flex">
    <aside class="side-plate border-b p-4 lg:fixed lg:inset-y-0 lg:w-64 lg:border-b-0 lg:border-r lg:p-6">
      <div class="flex items-center justify-between lg:block">
        <button onclick="showView('home')" class="brand-mark text-left">
          <img src="/assets/magic-deck-icon.png" alt="" class="h-10 w-10 object-contain">
          <span><span class="block text-[10px] uppercase tracking-[.24em] text-slate-500">Votre atelier Magic</span><span class="mt-1 block text-2xl font-bold">Magic Deck</span></span>
        </button>
        <button id="sync-mobile" onclick="syncData()" class="action-primary px-3 py-2 text-sm font-bold lg:hidden">Sync</button>
      </div>
      <nav class="mt-5 grid grid-cols-4 gap-2 lg:mt-14 lg:block lg:space-y-2" data-shell-nav aria-label="Navigation principale">
        <button data-nav="home" onclick="showView('home')" class="nav-active w-full rounded-sm border border-transparent px-3 py-2 text-left text-sm font-medium">Accueil</button>
        <button data-nav="decks" onclick="showView('decks')" class="w-full rounded-sm border border-transparent px-3 py-2 text-left text-sm font-medium text-slate-400 hover:text-white">Mes decks</button>
        <button data-nav="collection" onclick="showView('collection')" class="w-full rounded-sm border border-transparent px-3 py-2 text-left text-sm font-medium text-slate-400 hover:text-white">Collection</button>
        <button data-nav="simulation" onclick="showView('simulation')" class="w-full rounded-sm border border-transparent px-3 py-2 text-left text-sm font-medium text-slate-400 hover:text-white">Simulation</button>
        <div id="simulation-subnav" class="simulation-subnav" aria-label="Outils de simulation">
          <button type="button" data-simulation-nav="duel" onclick="showSimulationSection('duel')">Duel rapide</button>
          <button type="button" data-simulation-nav="lab" onclick="showSimulationSection('lab')">Deck Lab IA</button>
          <button type="button" data-simulation-nav="random" onclick="showSimulationSection('random')">Générateur local</button>
          <button type="button" data-simulation-nav="reports" onclick="showSimulationSection('reports')">Rapports</button>
          <button type="button" data-simulation-nav="engine" onclick="showSimulationSection('engine')">Moteur Forge</button>
        </div>
        <button data-nav="settings" onclick="showView('settings')" class="w-full rounded-sm border border-transparent px-3 py-2 text-left text-sm font-medium text-slate-400 hover:text-white">Réglages</button>
      </nav>
      <div class="mt-8 hidden lg:block">
        <button id="sync-desktop" onclick="syncData()" class="action-primary w-full px-4 py-3 text-sm font-bold transition disabled:opacity-50">Synchroniser</button>
        <p id="sidebar-status" class="mono mt-3 truncate text-[11px] text-slate-500">En attente de synchronisation</p>
      </div>
    </aside>

    <main class="w-full p-4 sm:p-8 lg:ml-64 lg:p-10">
      <div class="mx-auto max-w-7xl">
        <div id="alert" class="mb-6 hidden rounded-xl border px-4 py-3 text-sm" role="status"></div>
        <section id="view-home" data-view></section>
        <section id="view-decks" data-view class="hidden"></section>
        <section id="view-deck-detail" data-view class="hidden"></section>
        <section id="view-collection" data-view class="hidden"></section>
        <section id="view-settings" data-view class="hidden"></section>
        <section id="view-simulation" data-view class="hidden"></section>
      </div>
    </main>
  </div>
  <dialog id="card-dialog" aria-label="Aperçu de la carte">
    <button class="viewer-close" onclick="hideCardFocus()" aria-label="Fermer l’aperçu">Fermer <kbd>Esc</kbd></button>
    <img id="viewer-image" alt="">
    <p id="viewer-message" role="status"></p>
    <p id="viewer-name"></p>
  </dialog>

  <script src="/assets/app.js" defer></script>
  <script src="/assets/collection.js" defer></script>
  <script src="/assets/coach.js" defer></script>
  <script src="/assets/preview.js" defer></script>
  <script src="/assets/simulation.js" defer></script>

</body>
</html>
